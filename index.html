<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> POWER UP! - Portfolio</title>

    <!-- Google Fonts: Noto Sans Thai -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">


</head>

<body>
    <!-- top navbar -->
    <nav class="navbar app-nav">
        <div class="container-xl">
            <a class="navbar-brand fw-bold" href="#">
                POWER UP! <span class="fw-normal brand-sub">Learning Portfolio</span>
            </a>
        </div>
    </nav>

    <!-- main content -->

    <main class="container-xl py-4">
        <!-- พื้นที่สำหรับแจ้งเตือน toast (เผื่อใช้ใน js) -->
        <div id="toast-area" class="toast-area" aria-live="polite"></div>

        <div class="row g-4">
            <!-- sidebar ฝั่งซ้าย - สร้างและเลือก portfolio (issue #2) -->
            <aside class="col-lg-4">
                <section class="panel">
                    <h2 class="h2 fw-bold d-flex justify-content-between align-items-center mb-3">
                        Portfolios
                        <span class="badge text-bg-secondary fs-6" id="portfolio-count">0</span>
                    </h2>

                    <!-- รายการ portfolio ที่สร้างแล้ว -->
                    <div id="portfolio-list" class="list-group list-group-flush mb-3"></div>
                    <h3 class="h5 fw-bold mt-2 mb-3">Create New Portfolio</h3>

                    <form id="portfolio-form" novalidate>
                        <div class="mb-3">

                            <label class="form-label fw-semibold" for="p-name">
                                Display Name (ชื่อที่ต้องการแสดง) <span class="req">*</span>
                            </label>
                            <input class="form-control" id="p-name" name="name" type="text" maxlength="60"
                                placeholder="Full Name or Alias" required>
                            <div class="invalid-feedback">Please enter display name</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="p-enjoy">
                                What I Enjoy (ชอบทำอะไร) <span class="req">*</span>
                            </label>
                            <textarea class="form-control" id="p-enjoy" name="enjoy" rows="2"
                                placeholder="e.g., Writing websites, Designing UI" required></textarea>
                            <div class="invalid-feedback">Please enter what you enjoy doing</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="p-tried">
                                What I've Tried (ลองทำอะไรมาแล้ว) <span class="req">*</span>
                            </label>
                            <textarea class="form-control" id="p-tried" name="tried" rows="2"
                                placeholder="e.g., HTML, CSS, Bootstrap" required></textarea>
                            <div class="invalid-feedback">Please enter what you have tried</div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="p-curious">
                                What I'm Curious About (สนใจ/อยากรู้อะไรเพิ่ม) <span class="req">*</span>
                            </label>
                            <textarea class="form-control" id="p-curious" name="curious" rows="2"
                                placeholder="e.g., React, Database, AWS" required></textarea>
                            <div class="invalid-feedback">Please enter what you are curious about</div>
                        </div>

                        <button class="btn btn-accent w-100" type="submit">Create Portfolio</button>
                    </form>
                </section>
            </aside>

            <!-- ฝั่งขวา - ว่างไว้ให้ issue #3-#4 มาวางต่อ -->
            <section class="col-lg-8">
                <!-- พื้นที่สำหรับแสดง portfolio detail และ items -->
            </section>
        </div>
    </main>

    <!--scripts-->
    <script src="js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
